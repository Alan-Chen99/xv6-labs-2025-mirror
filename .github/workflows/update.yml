name: Update

on:
  push:
  schedule:
    - cron: "30 8 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.9"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: run formatting
        run: uv run ./format.py github-actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
