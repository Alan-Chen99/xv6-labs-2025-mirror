[project]
name = "xv6-labs-2025"
version = "0.1.0"
description = "Add your description here"
readme = "README"
requires-python = ">=3.13"
dependencies = [
  "black>=25.1.0",
  "cappa>=0.30.2",
  "clang-format>=21.1.0",
  "isort>=6.0.1",
  "pygit2>=1.18.2",
  "taplo>=0.9.3",
]

[dependency-groups]
dev = [
  #
  "autoflake>=2.3.1",
  "basedpyright>=1.31.0",
  "pyright>=1.1.403",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
treat_all_comments_as_code = true
force_single_line = true
group_by_package = true

[tool.pyright]
exclude = [".venv"]
typeCheckingMode = "strict"

reportUnusedImport = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
